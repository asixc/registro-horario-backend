quarkus.application.name=workmeter
quarkus.http.host=127.0.0.1
quarkus.http.limits.max-body-size=10M
quarkus.datasource.db-kind=postgresql
quarkus.datasource.db-version=18
quarkus.datasource.devservices.image-name=postgres:18
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.packages=com.workmeter.infrastructure.persistence
quarkus.jackson.fail-on-unknown-properties=true
quarkus.smallrye-openapi.info-title=WorkMeter API
quarkus.smallrye-openapi.info-version=0.1.0
workmeter.cookie-secure=true
workmeter.jwt-secret=${WORKMETER_JWT_SECRET:}
workmeter.bootstrap.email=${WORKMETER_BOOTSTRAP_EMAIL:}
workmeter.bootstrap.password=${WORKMETER_BOOTSTRAP_PASSWORD:}
workmeter.bootstrap.name=${WORKMETER_BOOTSTRAP_NAME:WorkMeter}
%dev.workmeter.cookie-secure=false
%dev.workmeter.jwt-secret=local-development-only-change-before-deploy-123456789
%test.workmeter.cookie-secure=false
%test.workmeter.jwt-secret=integration-test-only-secret-12345678901234567890
%test.workmeter.bootstrap.email=test@example.com
%test.workmeter.bootstrap.password=Testing-only-1234
